# PharmaC nginx vhost — setup.sh replaces example.duckdns.org with your FQDN
server {
    listen 80;
    listen [::]:80;
    server_name example.duckdns.org;

    root /var/www/pharmac/public;
    index index.php index.html;
    charset utf-8;

    # prescription images + the 512 MB bundle import in BackupController
    client_max_body_size 160M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # public/storage is a REAL directory in this repo (see config/filesystems.php),
    # it holds uploaded avatars / purchases / prescriptions.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # built assets (public/css, public/js, public/assets are committed)
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    error_page 404 /index.php;
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
