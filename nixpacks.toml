# Railway Nixpacks build configuration for PharmaC (Laravel 8)
# This tells Railway exactly how to build and run your app

[phases.setup]
nixPkgs = [
    "php82",
    "php82Extensions.pdo_mysql",
    "php82Extensions.mbstring",
    "php82Extensions.xml",
    "php82Extensions.gd",
    "php82Extensions.zip",
    "php82Extensions.bcmath",
    "php82Extensions.tokenizer",
    "php82Extensions.fileinfo",
    "php82Extensions.openssl",
]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan storage:link || true",
    "mkdir -p storage/framework/{sessions,views,cache}",
    "chmod -R 775 storage bootstrap/cache",
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
